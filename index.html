<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIGAA - Entrar no Sistema</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="info-sistema">
        <div>
          <h1>IF Sudeste MG - SIGAA</h1>
          <p>Sistema Integrado de Gestão de Atividades Acadêmicas</p>
        </div>
      </div>
    </header>
 
    <main class="conteudo">
      <form id="form-login" class="formulario caixa-login" novalidate>
        <h2 class="titulo">Entrar no Sistema</h2>
        <div class="campos">
          <div class="linha-campo">
            <label for="usuario">Usuário:</label>
            <input id="usuario" class="campo" type="text" autocomplete="username" required>
          </div>
          <div class="linha-campo">
            <label for="senha">Senha:</label>
            <input id="senha" class="campo" type="password" autocomplete="current-password" required>
          </div>
          <p id="erro-login" class="mensagem-erro" role="alert" hidden></p>
        </div>
        <div class="acoes">
          <button type="submit" class="botao">Entrar</button>
        </div>
      </form>
 
      <section class="credenciais" aria-labelledby="titulo-credenciais">
        <h2 id="titulo-credenciais">Acesso ao protótipo</h2>
        <p>Usuário: <code>admin</code></p>
        <p>Senha: <code>admin</code></p>
      </section>
    </main>
 
    <footer class="rodape">
      <iframe src="https://gamma.app/embed/ndxzpbwnz0a81bj" style="width: 700px; max-width: 100%; height: 450px" allow="fullscreen" title="Interface de Consulta Centralizada"></iframe>
      SIGAA | Instituto Federal do Sudeste de MG - (32) 3198-1456 | Copyright © 2006-2026 - UFRN - sig17.ifsudestemg.edu.br.sig17 - v4.11.3.96
    </footer>
  </div>
 
  <script src="index.js"></script>
</body>
</html>
